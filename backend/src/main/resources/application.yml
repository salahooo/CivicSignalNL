spring:
  application:
    name: CivicSignal NL API
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_REPORT_PROCESSOR_GROUP_ID:civic-signal-report-processor-v1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        spring.json.value.default.type: nl.salah.civicsignal.reports.ReportEvent
        spring.json.trusted.packages: nl.salah.civicsignal.reports
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
    listener:
      ack-mode: record
      ack-on-error: false
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5435/civicsignal}
    username: ${SPRING_DATASOURCE_USERNAME:civicsignal}
    password: ${SPRING_DATASOURCE_PASSWORD:civicsignal}
  flyway:
    enabled: true

civic-signal:
  amsterdam:
    enabled: ${CIVICSIGNAL_AMSTERDAM_ENABLED:false}
    base-url: ${CIVICSIGNAL_AMSTERDAM_BASE_URL:https://api.data.amsterdam.nl/v1/meldingen/meldingen}
    api-key: ${CIVICSIGNAL_AMSTERDAM_API_KEY:}
    page-size: ${CIVICSIGNAL_AMSTERDAM_PAGE_SIZE:50}
    maximum-records-per-import: ${CIVICSIGNAL_AMSTERDAM_MAX_RECORDS:100}
    request-timeout: ${CIVICSIGNAL_AMSTERDAM_REQUEST_TIMEOUT:10s}
    bootstrap-from: ${CIVICSIGNAL_AMSTERDAM_BOOTSTRAP_FROM:}
  generator:
    enabled: ${CIVICSIGNAL_GENERATOR_ENABLED:false}
    interval: ${CIVICSIGNAL_GENERATOR_INTERVAL:15s}
    maximum-per-run: ${CIVICSIGNAL_GENERATOR_MAXIMUM_PER_RUN:100}
    seed: ${CIVICSIGNAL_GENERATOR_SEED:}
    duplicate-probability: ${CIVICSIGNAL_GENERATOR_DUPLICATE_PROBABILITY:0.10}
    invalid-event-probability: ${CIVICSIGNAL_GENERATOR_INVALID_EVENT_PROBABILITY:0.00}
  cors:
    allowed-origins: ${CIVIC_SIGNAL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  kafka:
    raw-reports-topic: ${KAFKA_RAW_REPORTS_TOPIC:civic-reports.raw}
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:5s}
    dead-letter-topic: ${KAFKA_DEAD_LETTER_TOPIC:civic-reports.dlt}
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:250}
    dlt-projection-max-items: ${KAFKA_DLT_PROJECTION_MAX_ITEMS:500}

info:
  app:
    name: CivicSignal NL API
    description: Event-driven platform for Dutch public-space reports

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
