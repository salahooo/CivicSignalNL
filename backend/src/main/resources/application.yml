spring:
  application:
    name: CivicSignal NL API
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_REPORT_PROCESSOR_GROUP_ID:civic-signal-report-processor-v1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        spring.json.value.default.type: nl.salah.civicsignal.reports.ReportEvent
        spring.json.trusted.packages: nl.salah.civicsignal.reports
    listener:
      ack-mode: record
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

civic-signal:
  cors:
    allowed-origins: ${CIVIC_SIGNAL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  kafka:
    raw-reports-topic: ${KAFKA_RAW_REPORTS_TOPIC:civic-reports.raw}
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:5s}

info:
  app:
    name: CivicSignal NL API
    description: Event-driven platform for Dutch public-space reports

management:
  endpoints:
    web:
      exposure:
        include: health,info
