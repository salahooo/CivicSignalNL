spring:
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  application:
    name: CivicSignal NL API
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        interceptor.classes: nl.salah.civicsignal.observability.RequestIdProducerInterceptor
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:10000}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:15000}
    consumer:
      group-id: ${KAFKA_REPORT_PROCESSOR_GROUP_ID:civic-signal-report-processor-v1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        spring.json.value.default.type: nl.salah.civicsignal.reports.ReportEvent
        spring.json.trusted.packages: nl.salah.civicsignal.reports
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
    listener:
      ack-mode: record
      ack-on-error: false
      poll-timeout: 1s
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: ${ELASTICSEARCH_CONNECT_TIMEOUT:3s}
    socket-timeout: ${ELASTICSEARCH_REQUEST_TIMEOUT:5s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5435/civicsignal}
    username: ${SPRING_DATASOURCE_USERNAME:civicsignal}
    password: ${SPRING_DATASOURCE_PASSWORD:civicsignal}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 10
  flyway:
    enabled: true

civic-signal:
  outbox:
    enabled: ${CIVICSIGNAL_OUTBOX_ENABLED:true}
    fixed-delay: ${CIVICSIGNAL_OUTBOX_FIXED_DELAY:5000}
    batch-size: ${CIVICSIGNAL_OUTBOX_BATCH_SIZE:10}
    max-attempts: ${CIVICSIGNAL_OUTBOX_MAX_ATTEMPTS:5}
  admin:
    username: ${CIVICSIGNAL_ADMIN_USERNAME:admin}
    password: ${CIVICSIGNAL_ADMIN_PASSWORD:}
  amsterdam:
    source-name: ${CIVICSIGNAL_AMSTERDAM_SOURCE_NAME:amsterdam-open-data}
    enabled: ${CIVICSIGNAL_AMSTERDAM_ENABLED:false}
    base-url: ${CIVICSIGNAL_AMSTERDAM_BASE_URL:https://api.data.amsterdam.nl/v1/meldingen/meldingen}
    api-key: ${CIVICSIGNAL_AMSTERDAM_API_KEY:}
    page-size: ${CIVICSIGNAL_AMSTERDAM_PAGE_SIZE:50}
    maximum-records-per-import: ${CIVICSIGNAL_AMSTERDAM_MAX_RECORDS:100}
    request-timeout: ${CIVICSIGNAL_AMSTERDAM_REQUEST_TIMEOUT:10s}
    bootstrap-from: ${CIVICSIGNAL_AMSTERDAM_BOOTSTRAP_FROM:}
    scheduler:
      enabled: ${CIVICSIGNAL_AMSTERDAM_SCHEDULER_ENABLED:false}
      fixed-delay: ${CIVICSIGNAL_AMSTERDAM_SCHEDULER_FIXED_DELAY:15m}
      initial-delay: ${CIVICSIGNAL_AMSTERDAM_SCHEDULER_INITIAL_DELAY:30s}
      import-limit: ${CIVICSIGNAL_AMSTERDAM_SCHEDULER_IMPORT_LIMIT:100}
      failure-backoff: ${CIVICSIGNAL_AMSTERDAM_SCHEDULER_FAILURE_BACKOFF:30m}
      maximum-consecutive-failures: ${CIVICSIGNAL_AMSTERDAM_SCHEDULER_MAX_FAILURES:5}
      auto-pause-on-failure-threshold: ${CIVICSIGNAL_AMSTERDAM_SCHEDULER_AUTO_PAUSE:true}
  generator:
    enabled: ${CIVICSIGNAL_GENERATOR_ENABLED:false}
    interval: ${CIVICSIGNAL_GENERATOR_INTERVAL:15s}
    maximum-per-run: ${CIVICSIGNAL_GENERATOR_MAXIMUM_PER_RUN:100}
    seed: ${CIVICSIGNAL_GENERATOR_SEED:}
    duplicate-probability: ${CIVICSIGNAL_GENERATOR_DUPLICATE_PROBABILITY:0.10}
    invalid-event-probability: ${CIVICSIGNAL_GENERATOR_INVALID_EVENT_PROBABILITY:0.00}
  cors:
    allowed-origins: ${CIVIC_SIGNAL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  kafka:
    raw-reports-topic: ${KAFKA_RAW_REPORTS_TOPIC:civic-reports.raw}
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:5s}
    dead-letter-topic: ${KAFKA_DEAD_LETTER_TOPIC:civic-reports.dlt}
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:250}
    dlt-projection-max-items: ${KAFKA_DLT_PROJECTION_MAX_ITEMS:500}

info:
  app:
    name: CivicSignal NL API
    description: Event-driven platform for Dutch public-space reports

management:
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,elasticsearch,kafkaTopics,reportIndex,kafkaRecovery
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.kafka.listener: OFF
    org.apache.kafka: WARN
  structured:
    format:
      console: ecs
