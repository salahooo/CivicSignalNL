services:
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic civic-reports.raw
        --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic civic-reports.dlt
        --partitions 3 --replication-factor 1
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicsignal}
      POSTGRES_USER: ${POSTGRES_USER:-civicsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: civicsignal-backend:local
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: compose
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-civicsignal}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-civicsignal}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      CIVICSIGNAL_ADMIN_USERNAME: ${CIVICSIGNAL_ADMIN_USERNAME:-admin}
      CIVICSIGNAL_ADMIN_PASSWORD: ${CIVICSIGNAL_ADMIN_PASSWORD:-}
      CIVICSIGNAL_AMSTERDAM_ENABLED: ${CIVICSIGNAL_AMSTERDAM_ENABLED:-false}
      CIVICSIGNAL_AMSTERDAM_SCHEDULER_ENABLED: ${CIVICSIGNAL_AMSTERDAM_SCHEDULER_ENABLED:-false}
      CIVICSIGNAL_AMSTERDAM_API_KEY: ${CIVICSIGNAL_AMSTERDAM_API_KEY:-}
      CIVICSIGNAL_GENERATOR_ENABLED: ${CIVICSIGNAL_GENERATOR_ENABLED:-false}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    stop_grace_period: 60s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    image: civicsignal-frontend:local
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  kafka_data:
  elasticsearch_data:
  postgres_data:
